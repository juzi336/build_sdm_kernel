name: Compile SM8550 GKI Kernel (Fuxi)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: 检出当前仓库代码
      uses: actions/checkout@v4

    - name: 准备 SWAP
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16

    - name: 准备基础系统依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y git bc build-essential flex bison libssl-dev libelf-dev python3 zip curl

    - name: 配置最新 Repo 工具
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod +x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: 同步 GKI 5.15 源码
      run: |
        mkdir -p android-kernel && cd android-kernel
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15
        repo sync -c -j$(nproc) --no-clone-bundle

    - name: 设置 -ab 版本后缀
      env:
        AB_NUM: "20100722"
      run: |
        cd android-kernel/common
        if ! grep -qx 'echo "\$res"' scripts/setlocalversion; then
          echo "setlocalversion 末尾不是预期格式，内容如下："
          cat scripts/setlocalversion
          exit 1
        fi
        sed -i "s|^echo \"\$res\"\$|echo \"\$res-ab${AB_NUM}\"|" scripts/setlocalversion
        git add scripts/setlocalversion
        git commit -q -m "setlocalversion: append -ab${AB_NUM}"
        tail -5 scripts/setlocalversion

    - name: 编译内核 (Kleaf Bazel with Stamp)
      run: |
        cd android-kernel
        tools/bazel run --config=stamp //common:kernel_aarch64_dist -- --destdir=$PWD/out/dist
        strings -a out/dist/Image | grep -m1 "Linux version 5"

    - name: 打包 AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        cp $GITHUB_WORKSPACE/patches/anykernel.sh AnyKernel3/anykernel.sh
        cp android-kernel/out/dist/Image AnyKernel3/
        cd AnyKernel3
        zip -r ../fuxi-kernel-release.zip ./*

    - name: 上传刷机包 (AnyKernel3)
      uses: actions/upload-artifact@v4
      with:
        name: fuxi-kernel-ZIP
        path: ${{ github.workspace }}/fuxi-kernel-release.zip
如果「设置 -ab 版本后缀」步骤报错，把日志贴给我。