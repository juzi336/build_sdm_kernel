name: Compile SM8550 GKI Kernel (Fuxi - Custom Workflow)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: 准备 SWAP
      uses: pierotofy/set-swap-space@master
      with:
          swap-size-gb: 16

    - name: 准备环境
      run: |
        sudo apt-get update
        sudo apt-get install -y git bc build-essential flex bison libssl-dev libelf-dev clang lld llvm python3 zip curl repo

    - name: 配置 Repo 工具
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod +x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: 同步 GKI 5.15 源码
      run: |
        mkdir -p android-kernel && cd android-kernel
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15
        repo sync -c -j$(nproc) --no-tags --no-clone-bundle

    - name: 编译内核 (Kleaf Bazel)
      run: |
        cd android-kernel
        tools/bazel run //common:kernel_aarch64_dist -- --destdir=$PWD/out/dist

    - name: 打包 AnyKernel3
      run: |
        cd $GITHUB_WORKSPACE
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!BLOCK=.*!BLOCK=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=auto;/g' AnyKernel3/anykernel.sh
        
        cp android-kernel/out/dist/Image AnyKernel3/
        
        cd AnyKernel3
        zip -r ../fuxi-kernel-release.zip ./*

    - name: 上传刷机包 (AnyKernel3)
      uses: actions/upload-artifact@v4
      with:
        name: fuxi-kernel-ZIP
        path: ${{ github.workspace }}/fuxi-kernel-release.zip