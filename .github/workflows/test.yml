name: Build Xiaomi 12S Pro (unicorn) - Repo Source

on:
  workflow_dispatch:

jobs:
  build:
    name: Xiaomi12SPro-${{ matrix.ksu_status }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        ksu_status: [ "WithKSU", "NoKSU" ]

    steps:
    - name: Setup SWAP
      uses: pierotofy/set-swap-space@master
      with:
          swap-size-gb: 16
          
    - name: 准备环境
      run: |
        sudo apt-get update
        sudo apt-get install -y git bc build-essential flex bison libssl-dev libelf-dev python3 zip libssl-dev curl
        # 安装 repo 工具
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: 同步源码 (Repo Sync)
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        # 加上 --depth=1，只拉取最新提交，体积缩小90%
        repo init -u https://github.com/xiaomi-sm8450-kernel/manifest.git -b zeus-s-oss --depth=1
        # 优化同步参数，防止死锁
        repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --current-branch

    - name: 集成 KernelSU & SUSFS
      if: ${{ matrix.ksu_status == 'WithKSU' }}
      run: |
        # 写入 KSU 相关的 Defconfig 配置
        echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig
        echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/gki_defconfig
        
        # 运行 KernelSU 官方在线安装脚本
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
        sed -i 's/ -dirty//g' scripts/setlocalversion
        
        # 下载并集成 SUSFS
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 patch_susfs
        cp patch_susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch ./
        cp patch_susfs/kernel_patches/fs/* fs/
        cp patch_susfs/kernel_patches/include/linux/* include/linux/
        patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch
        rm -rf patch_susfs

    - name: 集成 Re:Kernel 基础补丁 (Integrate)
      run: |
        git clone -b upstream/v9.2 https://github.com/myflavor/ReKernel-X.git rekernel_tmp
        cp -r rekernel_tmp/Integrate/* ./
        rm -rf rekernel_tmp
        chmod +x patches.sh
        ./patches.sh

    - name: 集成 Re:Kernel LKM 源码 (Built-in 模式优化版)
      run: |
        git clone -b main https://github.com/myflavor/ReKernel-X.git rekernel_lkm
        mkdir -p drivers/rekernel
        cp -r rekernel_lkm/LKM-Source/* drivers/rekernel/
        rm -rf rekernel_lkm
        sed -i 's/obj-m/obj-y/g' drivers/rekernel/Makefile
        echo 'source "drivers/rekernel/Kconfig"' >> drivers/Kconfig
        echo 'obj-y += rekernel/' >> drivers/Makefile

    - name: 编译内核
      run: |
        export REKERNEL_X_VERSION=v9.2-BuiltIn
        chmod +x build.sh
        ./build.sh unicorn

    - name: 打包 AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!BLOCK=.*!BLOCK=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=auto;/g' AnyKernel3/anykernel.sh
        
        # 根据该源码树的产物路径复制编译好的 Image
        cp device/qcom/unicorn-kernel/Image AnyKernel3/
        
        ZIP_NAME="Xiaomi12SPro-${{ matrix.ksu_status }}.zip"
        cd AnyKernel3 && zip -r ../$ZIP_NAME ./*

    - name: 上传刷机包 (AnyKernel3)
      uses: actions/upload-artifact@v4
      with:
        name: Xiaomi12SPro-${{ matrix.ksu_status }}-ZIP
        path: ${{ github.workspace }}/Xiaomi12SPro-${{ matrix.ksu_status }}.zip