name: Build Xiaomi 12 SM8450 Kernel

on:
  workflow_dispatch:

env:
  CLANG_VERSION: r563880c
  KERNEL_SRC: https://github.com/LineageOS/android_kernel_xiaomi_sm8450
  BRANCH: lineage-23.2
  KERNEL_DEFCONFIG: gki_defconfig vendor/xiaomi_GKI.config vendor/cupid_GKI.config vendor/waipio_GKI.config vendor/debugfs.config

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Setup SWAP
      uses: pierotofy/set-swap-space@master
      with:
          swap-size-gb: 16
          
    - name: 准备环境
      run: |
        sudo apt-get update
        sudo apt-get install -y git bc build-essential flex bison libssl-dev libelf-dev clang lld llvm python3 zip

    - name: 编译器缓存
      id: cache-clang
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/clang-aosp
        key: clang-${{ env.CLANG_VERSION }}

    - name: 下载 Clang (r563880c)
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: |
        mkdir -p ${{ github.workspace }}/clang-aosp
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-qpr2-release/clang-${{ env.CLANG_VERSION }}.tar.gz
        tar -C ${{ github.workspace }}/clang-aosp -xf clang-${{ env.CLANG_VERSION }}.tar.gz

    - name: 检出源码并集成 KernelSU & SUSFS
      run: |
        cd $GITHUB_WORKSPACE
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 patch
        git clone --depth=1 ${{ env.KERNEL_SRC }} -b ${{ env.BRANCH }} sm8450
        echo "CONFIG_KSU=y" >> $GITHUB_WORKSPACE/sm8450/arch/arm64/configs/gki_defconfig
        echo "CONFIG_KSU_SUSFS=y" >> $GITHUB_WORKSPACE/sm8450/arch/arm64/configs/gki_defconfig
        echo "设置内核完成"
        
        cd $GITHUB_WORKSPACE/sm8450
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
        sed -i 's/ -dirty//g' scripts/setlocalversion
        echo "设置ksu完成"
        
        cp $GITHUB_WORKSPACE/patch/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch $GITHUB_WORKSPACE/sm8450/
        cp $GITHUB_WORKSPACE/patch/kernel_patches/fs/* $GITHUB_WORKSPACE/sm8450/fs/
        cp $GITHUB_WORKSPACE/patch/kernel_patches/include/linux/* $GITHUB_WORKSPACE/sm8450/include/linux/
        echo "cp完成"
        
        cd $GITHUB_WORKSPACE/sm8450
        patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch
        echo "susfs_patch完成"

    - name: 集成 Re:Kernel 基础补丁 (Integrate)
      run: |
        cd $GITHUB_WORKSPACE
        git clone -b upstream/v9.2 https://github.com/myflavor/ReKernel-X.git rekernel_tmp
        cp -r rekernel_tmp/Integrate/* $GITHUB_WORKSPACE/sm8450/
        rm -rf rekernel_tmp
        
        cd $GITHUB_WORKSPACE/sm8450
        chmod +x patches.sh
        ./patches.sh
        echo "基础补丁集成完成"

    - name: 集成 Re:Kernel LKM 源码 (Built-in 模式优化版)
      run: |
        cd $GITHUB_WORKSPACE
        # 克隆包含 LKM-Source 的 main 分支
        git clone -b main https://github.com/myflavor/ReKernel-X.git rekernel_lkm
        
        # 创建目标驱动目录并将 LKM 源码全部复制过去
        mkdir -p $GITHUB_WORKSPACE/sm8450/drivers/rekernel
        cp -r rekernel_lkm/LKM-Source/* $GITHUB_WORKSPACE/sm8450/drivers/rekernel/
        rm -rf rekernel_lkm
        
        # 进入目录，将原 Makefile 中的模块编译(obj-m)强行修改为内置编译(obj-y)
        cd $GITHUB_WORKSPACE/sm8450/drivers/rekernel
        sed -i 's/obj-m/obj-y/g' Makefile
        
        # 将整个 rekernel 文件夹挂载到内核驱动主链中
        cd $GITHUB_WORKSPACE/sm8450
        echo 'source "drivers/rekernel/Kconfig"' >> drivers/Kconfig
        echo 'obj-y += drivers/rekernel/' >> drivers/Makefile
        echo "LKM 源码挂载内核树完成"

    - name: 编译内核
      run: |
        cd sm8450
        export PATH="${{ github.workspace }}/clang-aosp/bin:$PATH"
        
        # 基础编译参数
        MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
        
        # 结合文档：在这里传入自定义版本号变量
        MAKE_ARGS="$MAKE_ARGS REKERNEL_X_VERSION=v9.2-BuiltIn"
        
        # (可选) 如果你想开启文档中提到的 Debug 调试级日志，请取消下面这行的注释(#)：
        # MAKE_ARGS="$MAKE_ARGS KCFLAGS=-DREKERNEL_X_DEBUG"
        
        # 开始编译
        make O=out $MAKE_ARGS ${{ env.KERNEL_DEFCONFIG }}
        make -j$(nproc --all) O=out $MAKE_ARGS

    - name: 打包 AnyKernel3
      run: |
        cd $GITHUB_WORKSPACE
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!BLOCK=.*!BLOCK=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=auto;/g' AnyKernel3/anykernel.sh
        cp sm8450/out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3 && zip -r ../Xiaomi-Marble-Kernel.zip ./*

    - name: 上传刷机包 (AnyKernel3)
      uses: actions/upload-artifact@v4
      with:
        name: Xiaomi12-cupid-Kernel-ZIP
        path: ${{ github.workspace }}/Xiaomi-Marble-Kernel.zip